<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#0b6bcb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="Suivi de forme">
<title>Suivi de forme</title>
<style>
:root{--bg:#f3f6f9;--card:#fff;--text:#14212b;--muted:#5d6b78;--line:#d5dde4;--accent:#0b6bcb;--on-accent:#fff;--warn:#9a4a00;--warnbg:#fff3df;--ok:#14663c;--okbg:#e4f5ea;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#0f1519;--card:#1a232a;--text:#eef3f6;--muted:#9aa9b5;--line:#2f3d47;--accent:#4aa3ff;--on-accent:#06121d;--warn:#ffb866;--warnbg:#33260f;--ok:#6fdc9a;--okbg:#12301f}}
*{box-sizing:border-box} [hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:540px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px 0}
h1{font-size:1.5rem;margin:0} h2{font-size:1rem;margin:0 0 10px}
.date{margin:2px 0 14px;color:var(--muted);text-transform:capitalize}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-weight:600;margin:0 0 6px} label+input,label+select{margin-bottom:12px}
input,select{width:100%;font:inherit;font-size:16px;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;-webkit-appearance:none;appearance:none}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.scale button{font:inherit;font-weight:700;font-size:1.1rem;min-height:48px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.scale button.on{color:#fff}
.ends{display:flex;justify-content:space-between;gap:8px;margin-top:8px;font-size:.8rem;color:var(--muted)}
.warn{background:var(--warnbg);border-color:var(--warn)} .warn label{color:var(--warn)}
.bar{position:sticky;bottom:0;background:var(--bg);padding:10px 0 calc(10px + env(safe-area-inset-bottom,0px))}
.btn{display:block;width:100%;font:inherit;font-weight:700;font-size:1rem;padding:15px;border:0;border-radius:12px;background:var(--accent);color:var(--on-accent);text-align:center;text-decoration:none;touch-action:manipulation}
.btn:disabled{opacity:.45} .btn.alt{background:transparent;color:var(--accent);border:1px solid var(--accent);margin-top:8px}
.hint{margin:8px 0 0;text-align:center;font-size:.85rem;color:var(--muted);min-height:1.2em}
.status{padding:10px 12px;border-radius:10px;background:var(--okbg);color:var(--ok);font-weight:600;margin:10px 0}
ul{list-style:none;margin:0;padding:0} li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line)} li:last-child{border-bottom:0} li b{font-variant-numeric:tabular-nums;text-align:right}.small{font-size:.85rem;color:var(--muted)}
</style>
</head>
<body>
<main>
<h1>Suivi de forme</h1><p class="date" id="today"></p>
<div id="formView">
<section class="card">
<label for="ath">Sportif</label><input id="ath" autocomplete="name" placeholder="Prénom Nom">
<label for="coach">E-mail du coach <span class="small">(optionnel)</span></label><input id="coach" type="email" inputmode="email" autocomplete="email" placeholder="coach@club.fr">
</section>
<div id="qs"></div>
<section class="card warn" id="zoneBox" hidden><label for="zone">7. Zone douloureuse</label><select id="zone"><option value="">Choisir une zone…</option></select></section>
<div class="bar"><button class="btn" id="save" type="button" disabled>Enregistrer</button><p class="hint" id="hint" aria-live="polite"></p></div>
</div>
<section id="done" hidden>
<div class="card"><h2 id="dName"></h2><ul id="dList"></ul><div class="status" id="dStatus">✓ Enregistré sur cet appareil</div>
<button class="btn" id="share" type="button">Partager le CSV via WhatsApp</button>
<a class="btn alt" id="mail">Envoyer par e-mail</a>
<button class="btn alt" id="download" type="button">Télécharger le CSV</button>
<button class="btn alt" id="copy" type="button">Copier le récapitulatif</button></div>
<button class="btn" id="again" type="button">Nouvelle saisie</button>
</section>
<section class="card" id="hist" hidden style="margin-top:12px"><h2>Dernières saisies sur cet appareil</h2><ul id="histList"></ul><button class="btn alt" id="exportAll" type="button">Télécharger tout l’historique (CSV)</button><p class="hint" id="exportMsg" aria-live="polite"></p></section>
</main>
<script>
(function(){
'use strict';
var Q=[
{k:'sommeil',t:'Qualité du sommeil',lo:'Très mauvaise',hi:'Excellente',good:'high',l:'Sommeil'},
{k:'energie',t:"Niveau d'énergie",lo:'Très faible',hi:'Très élevé',good:'high',l:'Énergie'},
{k:'stress',t:'Niveau de stress',lo:'Aucun',hi:'Très élevé',good:'low',l:'Stress'},
{k:'courbatures',t:'Niveau de courbatures',lo:'Aucune',hi:'Très fortes',good:'low',l:'Courbatures'},
{k:'motivation',t:'Motivation',lo:'Aucune',hi:'Maximale',good:'high',l:'Motivation'},
{k:'douleur',t:'Douleur',lo:'Aucune',hi:'Très forte',good:'low',l:'Douleur'}];
var ZONES=['Tête / nuque','Cou / cervicales','Épaule','Bras / biceps / triceps','Coude','Poignet / main','Poitrine / côtes','Haut du dos','Bas du dos / lombaires','Abdomen','Hanche / bassin','Fessier','Aine / adducteurs','Cuisse (avant)','Cuisse (arrière)','Genou','Mollet','Tibia','Cheville','Pied / orteils','Autre'];
var KEY='suivi-forme-v2', scores={}, last=null;
function el(id){return document.getElementById(id)}
function pad(n){return String(n).length<2?'0'+n:String(n)}
function dateNow(){var d=new Date();return{iso:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),fr:pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear(),long:d.toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}}
function emptyData(){return{athlete:'',coach:'',entries:[]}}
function load(){try{var raw=localStorage.getItem(KEY)||localStorage.getItem('suivi-forme-v1');if(raw){var x=JSON.parse(raw);x.entries=x.entries||[];return x}}catch(e){}return emptyData()}
var data=load();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(data));return true}catch(e){return false}}
function slug(s){return (s||'').normalize?s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'')||'sportif':(s||'sportif').toLowerCase().replace(/[^a-z0-9]+/g,'-')}
function esc(s){return '"'+String(s==null?'':s).replace(/"/g,'""')+'"'}
function csvOne(e){var h=['date','sportif'];var v=[e.date,e.athlete];Q.forEach(function(q){h.push(q.k);v.push(e.scores[q.k])});h.push('zone_douloureuse');v.push(e.zone||'');return h.map(esc).join(';')+'\r\n'+v.map(esc).join(';')}
function csvAll(list){if(!list.length)return'';var h=['date','sportif'];Q.forEach(function(q){h.push(q.k)});h.push('zone_douloureuse');var rows=[h.map(esc).join(';')];list.forEach(function(e){var v=[e.date,e.athlete];Q.forEach(function(q){v.push(e.scores[q.k])});v.push(e.zone||'');rows.push(v.map(esc).join(';'))});return rows.join('\r\n')}
function recap(e){var p=e.date.split('-');var s='Suivi de forme - '+e.athlete+' - '+p[2]+'/'+p[1]+'/'+p[0]+'\n';s+=Q.map(function(q){return q.l+' : '+e.scores[q.k]+'/10'}).join('\n');if(e.zone)s+='\nZone douloureuse : '+e.zone;return s}
function downloadText(name,text,type){var blob=new Blob(['\uFEFF',text],{type:type||'text/csv;charset=utf-8'});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();setTimeout(function(){URL.revokeObjectURL(url);document.body.removeChild(a)},1000)}
function copyText(text,button){if(navigator.clipboard&&window.isSecureContext){navigator.clipboard.writeText(text).then(function(){button.textContent='Copié ✓'},function(){legacyCopy(text,button)})}else legacyCopy(text,button)}
function legacyCopy(text,button){var ta=document.createElement('textarea');ta.value=text;ta.setAttribute('readonly','');ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();ta.setSelectionRange(0,ta.value.length);try{document.execCommand('copy');button.textContent='Copié ✓'}catch(e){button.textContent='Copie impossible'}document.body.removeChild(ta)}
function paint(k){var q=null,i;for(i=0;i<Q.length;i++)if(Q[i].k===k)q=Q[i];var box=document.querySelector('.scale[data-k="'+k+'"]');if(!box)return;var buttons=box.getElementsByTagName('button');for(i=0;i<buttons.length;i++){var b=buttons[i],v=parseInt(b.getAttribute('data-v'),10),on=scores[k]===v;b.className=on?'on':'';b.setAttribute('aria-pressed',on?'true':'false');if(on){var g=q.good==='high'?v:11-v;b.style.background='hsl('+((g-1)/9*120)+' 62% 38%)';b.style.borderColor='transparent'}else{b.style.background='';b.style.borderColor=''}}}
function refresh(){var pain=scores.douleur>5;el('zoneBox').hidden=!pain;if(!pain)el('zone').value='';var name=el('ath').value.trim(),left=0;Q.forEach(function(q){if(!scores[q.k])left++});var msg='';if(!name)msg='Nom du sportif requis';else if(left)msg=left+(left>1?' questions restantes':' question restante');else if(pain&&!el('zone').value)msg='Choisir la zone douloureuse';el('hint').textContent=msg;el('save').disabled=!!msg}
function renderHistory(){var list=data.entries.slice(-5).reverse(),ul=el('histList');ul.innerHTML='';el('hist').hidden=!list.length;list.forEach(function(e){var p=e.date.split('-'),li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('span');a.textContent=p[2]+'/'+p[1]+' · '+e.athlete;b.textContent='✓ enregistré';b.className='small';li.appendChild(a);li.appendChild(b);ul.appendChild(li)});el('exportAll').textContent='Télécharger tout l’historique ('+data.entries.length+' saisie'+(data.entries.length>1?'s':'')+', CSV)'}
function showDone(e){last=e;el('formView').hidden=true;el('done').hidden=false;el('dName').textContent=e.athlete+' · '+dateNow().fr;var ul=el('dList');ul.innerHTML='';Q.forEach(function(q){var li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('b');a.textContent=q.l;b.textContent=e.scores[q.k]+'/10';li.appendChild(a);li.appendChild(b);ul.appendChild(li)});if(e.zone){var li=document.createElement('li'),a=document.createElement('span'),b=document.createElement('b');a.textContent='Zone douloureuse';b.textContent=e.zone;li.appendChild(a);li.appendChild(b);ul.appendChild(li)}el('dStatus').textContent='✓ Enregistré sur cet appareil';var body=recap(e);el('mail').href='mailto:'+encodeURIComponent(data.coach||'')+'?subject='+encodeURIComponent('Suivi de forme - '+e.athlete+' - '+dateNow().fr)+'&body='+encodeURIComponent(body);el('mail').textContent=data.coach?'Envoyer au coach par e-mail':'Envoyer par e-mail';window.scrollTo(0,0)}
function save(){refresh();if(el('save').disabled)return;var t=dateNow(),name=el('ath').value.trim();var e={id:slug(name)+'_'+t.iso,athlete:name,date:t.iso,savedAt:new Date().toISOString(),scores:{},zone:scores.douleur>5?el('zone').value:null};Q.forEach(function(q){e.scores[q.k]=scores[q.k]});data.athlete=name;data.coach=el('coach').value.trim();data.entries=data.entries.filter(function(x){return x.id!==e.id});data.entries.push(e);data.entries=data.entries.slice(-400);persist();showDone(e);renderHistory()}
function shareLast(){if(!last)return;var text=recap(last),name='suivi-forme_'+slug(last.athlete)+'_'+last.date+'.csv',blob=new Blob(['\uFEFF',csvOne(last)],{type:'text/csv;charset=utf-8'}),file;try{file=new File([blob],name,{type:'text/csv',lastModified:Date.now()})}catch(e){file=null}if(file&&navigator.share&&navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({title:'Suivi de forme - '+last.athlete,text:'Fichier CSV du suivi de forme de '+last.athlete+'.',files:[file]}).catch(function(err){if(err&&err.name==='AbortError')return;downloadText(name,csvOne(last));el('share').textContent='CSV téléchargé · joindre dans WhatsApp'})}else{downloadText(name,csvOne(last));var url='https://wa.me/?text='+encodeURIComponent(text+'\n\nLe fichier CSV vient d’être téléchargé. Merci de le joindre à ce message.');window.location.href=url;el('share').textContent='CSV téléchargé · joindre dans WhatsApp'}}
el('today').textContent=dateNow().long;el('ath').value=data.athlete||'';el('coach').value=data.coach||'';
ZONES.forEach(function(z){var o=document.createElement('option');o.value=z;o.textContent=z;el('zone').appendChild(o)});
Q.forEach(function(q,index){var sec=document.createElement('section');sec.className='card';var h=document.createElement('h2');h.textContent=(index+1)+'. '+q.t;sec.appendChild(h);var box=document.createElement('div');box.className='scale';box.setAttribute('data-k',q.k);for(var n=1;n<=10;n++){var b=document.createElement('button');b.type='button';b.setAttribute('data-v',n);b.setAttribute('aria-pressed','false');b.setAttribute('aria-label',q.t+' : '+n+' sur 10');b.textContent=n;box.appendChild(b)}sec.appendChild(box);var ends=document.createElement('div');ends.className='ends';var lo=document.createElement('span'),hi=document.createElement('span');lo.textContent='1 · '+q.lo;hi.textContent=q.hi+' · 10';ends.appendChild(lo);ends.appendChild(hi);sec.appendChild(ends);el('qs').appendChild(sec)});
el('qs').addEventListener('click',function(ev){var node=ev.target;while(node&&node!==el('qs')&&!(node.tagName==='BUTTON'&&node.hasAttribute('data-v')))node=node.parentNode;if(!node||node===el('qs'))return;var k=node.parentNode.getAttribute('data-k');scores[k]=parseInt(node.getAttribute('data-v'),10);paint(k);refresh()});
el('ath').addEventListener('input',function(){data.athlete=this.value;persist();refresh()});el('coach').addEventListener('input',function(){data.coach=this.value.trim();persist()});el('zone').addEventListener('change',refresh);
el('save').addEventListener('click',save);el('share').addEventListener('click',shareLast);el('copy').addEventListener('click',function(){if(last)copyText(recap(last),this)});el('download').addEventListener('click',function(){if(last)downloadText('suivi-forme_'+slug(last.athlete)+'_'+last.date+'.csv',csvOne(last))});
el('exportAll').addEventListener('click',function(){if(data.entries.length){downloadText('suivi-forme_historique.csv',csvAll(data.entries));el('exportMsg').textContent='Le fichier CSV a été préparé.'}});
el('again').addEventListener('click',function(){scores={};Q.forEach(function(q){paint(q.k)});el('zone').value='';el('done').hidden=true;el('formView').hidden=false;el('today').textContent=dateNow().long;el('copy').textContent='Copier le récapitulatif';refresh();window.scrollTo(0,0)});
renderHistory();refresh();
})();
</script>
<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('./service-worker.js').catch(function () {});
  });
}
</script>
</body>
</html>
